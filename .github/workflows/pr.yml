name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: cd packages/sdk && bun run build

      - name: Build CLI
        run: cd packages/cli && bun run build

      - name: Build UI
        run: cd packages/ui && bun run build

      - name: Typecheck packages
        run: |
          cd packages/contract && bunx tsc --noEmit
          cd ../sdk && bunx tsc --noEmit
          cd ../cli && bunx tsc --noEmit
          cd ../server && bunx tsc --noEmit
          cd ../ingestion-worker && bunx tsc --noEmit

      - name: Test
        run: |
          cd packages/server && bun test || true
          cd ../ingestion-worker && bun test || true

  preview-deploy:
    needs: check
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build UI
        run: cd packages/ui && bun run build

      - name: Upload Worker preview version
        id: deploy
        working-directory: packages/server
        run: |
          bunx wrangler versions upload | tee /tmp/deploy.log
          URL=$(grep -oiE 'https://[a-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}" || "(see workflow logs)";
            const body = `🔗 **Worker preview:** ${url}\n\n> ⚠️ The preview binds the **production** D1 — avoid destructive test data.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body?.includes('Worker preview'));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.pull_request.number, body });
            }
